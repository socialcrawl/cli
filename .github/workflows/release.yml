name: Release

# Pushing a tag vX.Y.Z publishes that version to npm with provenance and creates the
# GitHub release from its CHANGELOG.md entry. Run `node tools/release.ts` before tagging:
# it runs the leak gate, which only the maintainer's machine has.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node tools/release.ts --ci --tag "$GITHUB_REF_NAME" --notes release-notes.md
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
